<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitHub Theme Updater - banner 772x250</title>
<style>
  /*
   * Rendered at 772x250. The 1544x500 variant is this same page at
   * --force-device-scale-factor=2, so every measurement is in CSS pixels and
   * nothing may depend on the device pixel ratio.
   *
   * Typeface note: the display face is a high-contrast serif. "Bodoni MT"
   * ships with Microsoft Office and "Playfair Display" only if it was
   * installed by hand, so Georgia is the fallback. Georgia is a lower
   * contrast face and the headline will look noticeably heavier with it -
   * check the render if you are on a machine without the first two. Nothing
   * is fetched over the network, because Chrome screenshots before a webfont
   * finishes downloading.
   */

  :root {
    --bg:        #0d0d0f;
    --card:      #151517;
    --card-line: #26262a;
    --blue:      #2f80ed;
    --blue-soft: #4a9eff;
    --text:      #ffffff;
    --muted:     #8a8f98;
  }

  html, body { margin: 0; padding: 0; }

  body {
    width: 772px;
    height: 250px;
    overflow: hidden;
    background: var(--bg);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .banner {
    position: relative;
    width: 772px;
    height: 250px;
    background: var(--bg);
  }

  /* ---------------------------------------------------------------- left */
  /* Text stays inside the left half with a 44px margin: wordpress.org crops
     the banner on narrow screens and lays its own plugin name over it. */
  .content {
    position: absolute;
    left: 44px;
    top: 28px;
    width: 340px;
    height: 194px;
    display: flex;
    flex-direction: column;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.3px;
    color: #9aa0a8;
  }

  .eyebrow .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--blue-soft);
  }

  .title {
    margin: 14px 0 0;
    font-family: "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 54px;
    line-height: 0.94;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .subtitle {
    margin: 12px 0 0;
    font-size: 15px;
    font-weight: 400;
    color: #7e93ad;
  }

  .pills {
    margin-top: auto;
    display: flex;
    gap: 7px;
  }

  .pill {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2px;
    padding: 5px 12px;
    border-radius: 999px;
    color: #9aa0a8;
    border: 1px solid #2a2a2e;
    background: #141416;
    white-space: nowrap;
  }

  .pill.primary {
    background: var(--blue);
    border-color: var(--blue);
    color: #ffffff;
  }

  /* --------------------------------------------------------------- right */
  /* A miniature of what the plugin actually shows on its Update tab: the
     releases it found on GitHub and what it did with them. */
  .panel {
    position: absolute;
    left: 432px;
    top: 30px;
    width: 296px;
    height: 190px;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 12px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    padding: 14px 16px;
    box-sizing: border-box;
  }

  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .panel-title {
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
  }

  .panel-note {
    font-size: 8px;
    color: #55585f;
  }

  table {
    width: 100%;
    margin-top: 11px;
    border-collapse: collapse;
  }

  th {
    font-size: 7.5px;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #5d626a;
    text-align: left;
    padding-bottom: 7px;
  }

  th.right, td.right { text-align: right; }

  td {
    font-size: 10px;
    color: #c9ced6;
    padding: 7px 0;
    border-top: 1px solid #222226;
    white-space: nowrap;
  }

  td.ver { color: #ffffff; font-weight: 600; }

  .tag {
    display: inline-block;
    font-size: 8.5px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
    background: #1e2a3a;
    color: #7fb2ff;
  }

  .tag.now {
    background: var(--blue);
    color: #ffffff;
  }

  /* The source node, wired into the panel - the release on GitHub that the
     rows above came from. */
  .node {
    position: absolute;
    left: 352px;
    top: 96px;
    width: 58px;
    height: 44px;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 8px;
    padding: 7px 8px;
    box-sizing: border-box;
  }

  .node-label {
    font-size: 6px;
    font-weight: 700;
    letter-spacing: 0.9px;
    color: #5d626a;
  }

  .node-bar {
    height: 3px;
    border-radius: 2px;
    background: var(--blue);
    margin-top: 5px;
  }

  .node-bar.w1 { width: 34px; }
  .node-bar.w2 { width: 24px; opacity: 0.6; }

  .wires {
    position: absolute;
    left: 408px;
    top: 60px;
    width: 26px;
    height: 130px;
  }
</style>
</head>
<body>
  <div class="banner">

    <div class="content">
      <div class="eyebrow"><span class="dot"></span>MS-M</div>

      <h1 class="title">Theme<br>Updater</h1>

      <p class="subtitle">from a GitHub repository</p>

      <div class="pills">
        <span class="pill primary">GitHub</span>
        <span class="pill">Backups</span>
        <span class="pill">Rollback</span>
      </div>
    </div>

    <div class="node">
      <div class="node-label">RELEASE</div>
      <div class="node-bar w1"></div>
      <div class="node-bar w2"></div>
    </div>

    <svg class="wires" viewBox="0 0 26 130" fill="none"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M0 58 C 14 58, 12 22, 26 22" stroke="#2f80ed" stroke-width="1.2" opacity="0.75"/>
      <path d="M0 62 C 14 62, 12 62, 26 62" stroke="#2f80ed" stroke-width="1.2" opacity="0.75"/>
      <path d="M0 66 C 14 66, 12 102, 26 102" stroke="#2f80ed" stroke-width="1.2" opacity="0.75"/>
    </svg>

    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">Theme updates</span>
        <span class="panel-note">read from GitHub releases</span>
      </div>

      <table>
        <thead>
          <tr>
            <th>Version</th>
            <th>Published</th>
            <th class="right">State</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="ver">v2.4.0</td>
            <td>13 Aug</td>
            <td class="right"><span class="tag now">Update</span></td>
          </tr>
          <tr>
            <td class="ver">v2.3.1</td>
            <td>22 Jul</td>
            <td class="right"><span class="tag">Installed</span></td>
          </tr>
          <tr>
            <td class="ver">v2.3.0</td>
            <td>03 Jun</td>
            <td class="right">Backed up</td>
          </tr>
          <tr>
            <td class="ver">v2.2.0</td>
            <td>02 May</td>
            <td class="right">Backed up</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</body>
</html>
