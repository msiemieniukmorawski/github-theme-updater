<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitHub Theme Updater - icon 128x128</title>
<style>
  /*
   * Rendered at 128x128; the 256x256 variant is this page at
   * --force-device-scale-factor=2.
   *
   * The icon has to survive being shown at 32px in the plugin list, so it is
   * one shape in two colours, no text, and no detail finer than the stroke
   * width. Same palette and same shape as the mark on the banner.
   */
  html, body { margin: 0; padding: 0; }

  body {
    width: 128px;
    height: 128px;
    overflow: hidden;
    background: #1d2327;
  }

  .icon {
    display: block;
    width: 128px;
    height: 128px;
    background: linear-gradient(140deg, #1d2327 0%, #16324a 100%);
  }
</style>
</head>
<body>
  <svg class="icon" viewBox="0 0 128 128" fill="none"
       xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="GitHub Theme Updater">
    <path d="M42 30 L20 64 L42 98" stroke="#4f94d4" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M86 30 L108 64 L86 98" stroke="#4f94d4" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M64 28 L64 76" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
    <path d="M47 61 L64 78 L81 61" stroke="#ffffff" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M45 100 L83 100" stroke="#00a32a" stroke-width="11" stroke-linecap="round"/>
  </svg>
</body>
</html>
