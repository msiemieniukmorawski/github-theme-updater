<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-label="GitHub Theme Updater">
  <title>GitHub Theme Updater</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2327"/>
      <stop offset="1" stop-color="#16324a"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" fill="url(#bg)"/>

  <!-- Code brackets. -->
  <path d="M42 30 L20 64 L42 98" fill="none" stroke="#4f94d4" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M86 30 L108 64 L86 98" fill="none" stroke="#4f94d4" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Download arrow. -->
  <path d="M64 28 L64 76" fill="none" stroke="#ffffff" stroke-width="11"
        stroke-linecap="round"/>
  <path d="M47 61 L64 78 L81 61" fill="none" stroke="#ffffff" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The line it lands on. -->
  <path d="M45 100 L83 100" fill="none" stroke="#00a32a" stroke-width="11"
        stroke-linecap="round"/>
</svg>
