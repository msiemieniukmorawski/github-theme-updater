<?xml version="1.0" encoding="UTF-8"?>
<!--
  Must stay identical in design to src/icon.html, because wordpress.org
  prefers this file over the PNG icons wherever the browser supports it.
  If you change one, change the other and re-render the PNGs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-label="GitHub Theme Updater">
  <title>GitHub Theme Updater</title>

  <rect width="128" height="128" fill="#0d0d0f"/>

  <!-- Code brackets: the repository the theme comes from. -->
  <path d="M42 30 L20 64 L42 98" fill="none" stroke="#2f80ed" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M86 30 L108 64 L86 98" fill="none" stroke="#2f80ed" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Download arrow: the release landing on the site. -->
  <path d="M64 26 L64 74" fill="none" stroke="#ffffff" stroke-width="11"
        stroke-linecap="round"/>
  <path d="M47 59 L64 76 L81 59" fill="none" stroke="#ffffff" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M45 98 L83 98" fill="none" stroke="#ffffff" stroke-width="11"
        stroke-linecap="round"/>
</svg>
